# Every device is asked for its Access Document, even one whose key the trust
# store already holds, and the fast phase is skipped. It is the only way to see
# the learn path run when the controller installs each key before its device
# first walks up. The pairing on the board is kept: flash this over a paired
# lock, walk up, read the log, flash the plain image back.
#
#   key LEARNED from its Access Document ...   the document passed
#   Access Document verdict: step=N ...        it did not, and N says where
#
# A device that advertises no document is refused on this image.
#
# Bench only, like every file in this directory: never on a mounted door.
# Build: make build CDK_BUILD=build/cdk-stepup-force CDK_CONF="overlay-thread.conf;overlays/bench-stepup-force.conf;overlay-lto.conf"
# Flash: make flash CDK_BUILD=build/cdk-stepup-force
CONFIG_ULTRAWIDELOCK_CRED_STEPUP_FORCE=y
