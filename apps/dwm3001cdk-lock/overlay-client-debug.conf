# Room for the Matter CLIENT in a DEBUG image.
#
#   make build CLIENT=1
#
# Applied automatically for CLIENT=1 without RELEASE=1, because without it that
# combination does not link -- it overflows FLASH, and it never has fitted.
# MEASURED, against the linker's FLASH region so that the two halves are the
# same quantity (ld is what refuses first, before imgtool gets a chance):
#
#   thread+lto (debug, no client)   423,332 B used,  10,332 B region free
#   untrimmed CLIENT=1                               ld: overflowed by 5,300 B
#                                                    ---------
#   so the client role costs                          15,632 B
#
# and with this file applied the image was 430,000 B, which is 8,964 B of that
# bought back -- 1,929 B clear of the 431,929 B ceiling imgtool enforced before
# the single-slot sector count was pinned. See pm_static.yml for the derivation.
#
# RE-MEASURED 2026-08-23 at d8156563: 431,724 B used, 205 B clear under that old
# 128-sector check. `--max-sectors 1` raises the same image's signing clearance
# by 1,524 B without changing its bytes, to 1,729 B. That is still tight.
#
# WHAT WAS SPENT AND WHAT WAS FOUND getting the client working on hardware:
#
#   +2,392 B  the X.509 DER TBSCertificate converter, which is what makes a
#             real peer's certificate verifiable at all. Not optional and not
#             shrinkable: see matter_case.c.
#     +216 B  relocking the bound lock when this one relocks
#   -3,764 B  dead weight found while looking for room: OpenThread's ping
#             sender and uptime counter (no caller, and ot::Instance members so
#             --gc-sections can never drop them), and AES-CCM linked twice
#             because the 802.15.4 driver compiled its own copy while
#             OPENTHREAD_MAC_SOFTWARE_TX_SECURITY_ENABLE was already on
#     -~600 B per-datagram narration in matter_commission.c demoted to DBG
#
# THE LOG DEMOTIONS ARE RECOVERABLE AND THE FEATURE CUTS ARE NOT, which is the
# order to spend in. `matter_ble` at DBG brings every demoted line back. What
# stays at INF is anything reporting a DECISION -- writes, invokes, AddNOC, the
# CASE handshake, refusals, unsecured drops, and the LockState report line,
# which was demoted once and put back because rc is the only way to tell a dead
# subscription from one that never matched.
#
# THAT IS A NARROW FIT AND IT IS MEANT TO BE. This profile is not gated by a
# recorded baseline: at that much free it sits under the 8,192 B floor the other
# profiles are held to, and recording it would mean lowering that floor to fit
# the image, which is the one move `make cdk-size-baseline` refuses on purpose.
# The build failing to sign IS the gate here. If it fails, buy the bytes back
# below rather than raising the ceiling.
#
# The RELEASE image has room only because overlay-release.conf drops
# CONFIG_LOG_DEFAULT_LEVEL to 1, which that file measured at 20,568 B. Taking
# the same lever here would defeat the purpose: the reason to build a debug
# client image is to WATCH THE CLIENT, and a global level of 1 takes its lines
# along with everyone else's.
#
# So this trims by MODULE, against one question: can this line say anything
# about why a bound lock did or did not open? Everything that can, stays.
#
# ONLY FOUR SYMBOLS ARE AVAILABLE, and that is a property of the tree rather
# than a choice. A module gets a settable level only where a Kconfig declares
# one (`module = X` / `module-str = y`), and most do not: ultrawidelock_cred_uwb,
# thread_gate, ccc_shim and ultrawidelock_rng all register with a literal
# LOG_LEVEL_INF and cannot be turned down from a .conf file at all. Setting a
# level symbol that does not exist ABORTS the CMake configure rather than
# warning, so every symbol below was read out of a `module =` line first.
#
# WHAT STAYS, and why:
#
#   matter_client   the whole point: Sigma1/2/3, the resolve, the invoke, and
#                   every refusal reason. It has a log module of its own for
#                   exactly this -- see apps/dwm3001cdk-lock/Kconfig. Before that
#                   split it logged under matter_ble, and there was no way to
#                   buy flash from Matter without silencing the client too.
#   matter_ble      NOT trimmed. It carries commissioning and fabric handling,
#                   which is where "no second administrator" appears.
#   matter_thread   NOT trimmed either, and now a switch of its own: SRP
#                   registration and DNS-SD resolution, which is what explains
#                   "the bound lock did not resolve". It shared the matter_ble
#                   symbol until the split in apps/dwm3001cdk-lock/Kconfig, so
#                   quieting commissioning used to take this with it.
#
# WHAT GOES. All of these keep LOG_ERR, so a fault still announces itself; what
# goes is the INF/WRN narration around it.
#
#   ULTRAWIDELOCK_CRED   the biggest single trim, and the furthest from this
#                        question. Covers ultrawidelock_reader and
#                        ultrawidelock_ranging: the credential exchange and the
#                        ranging that gates it. A walk-up that never granted
#                        never reaches the client at all, and that case is
#                        diagnosed with this overlay off.
#   ULTRAWIDELOCK_DFU    firmware updates. Nothing to do with opening a door.
#   DW3000               the radio driver's own chatter.
#
# ULTRAWIDELOCK_NFC is NOT here, and the reason is worth keeping: its level
# symbol does not exist on this image. overlay-thread.conf configures the NFC
# transport out, so the `if ULTRAWIDELOCK_NFC` block that would declare
# ULTRAWIDELOCK_NFC_LOG_LEVEL never instantiates. Setting it aborted the CMake
# configure -- which is exactly the failure the note above describes, met on the
# first build of this file.
#
# IF YOU ARE DIAGNOSING ANY OF THOSE, this is the wrong image: build without
# CLIENT=1 and they all come back at INF, because then there is room for them.
#
# THE MARGIN IS THIN, so re-measure rather than assuming. When it stops fitting,
# the levers in the order they are worth taking:
#
#   1. HUNT DEAD WEIGHT FIRST. It was worth 3,764 B in 2026-08-23's search and
#      cost nothing at all -- two OpenThread modules with no caller and a
#      second copy of AES-CCM. Measure with nm on the ELF before assuming there
#      is none left; --gc-sections cannot drop a C++ object's members, so
#      "unused" and "not linked" are different questions.
#   2. Demote more narration to DBG, cheapest first, and only lines that report
#      bookkeeping rather than a decision.
#   3. Drop the patch_staging partition, worth 32,768 B on its own and costing
#      a debug board only the ability to receive an OTA delta nobody was going
#      to send it. Needs a second pm_static.yml, a guard on PM_PATCH_STAGING_ID
#      in ports/zephyr/osal/flash_zephyr.c, and mcuboot_CONFIG_ULTRAWIDELOCK_DFU_APPLIER=n
#      in mk/cdk.mk -- the bootloader references the partition too, and without
#      that it stops compiling.
#
# WHAT (3) REALLY COSTS, since it reads cheaper than it is: a board carrying the
# debug map cannot be moved to the release map by FOTA. There is no secondary
# slot on this part, so an update is an in-place delta staged in the partition
# being removed. The transition becomes wired-only, `west flash`, forever. Fine
# for a board on a desk with a J-Link on it; not fine for anything else.
# settings_storage stays at 0x7c000 either way, so fabrics, trust anchors and
# the reader key survive the move in both directions.
#
# TWO THINGS ARE NOT LEVERS, both measured 2026-08-22 rather than assumed:
# -Oz (CONFIG_SIZE_OPTIMIZATIONS_AGGRESSIVE) saves ONE BYTE over -Os on this
# GCC under LTO, and -flto-partition=one saves nothing attributable. Do not
# spend a build on either; see overlay-lto.conf.

# The client's own narration, at full verbosity. The one module this image
# exists to read.
CONFIG_ULTRAWIDELOCK_MATTER_CLIENT_LOG_LEVEL_DBG=y

# Errors only, from everything the client cannot be blamed on.
CONFIG_ULTRAWIDELOCK_CRED_LOG_LEVEL_ERR=y
CONFIG_ULTRAWIDELOCK_DFU_LOG_LEVEL_ERR=y
CONFIG_DW3000_LOG_LEVEL_ERR=y

# No step-up (a Watch learned from its Access Document) on this image: the one
# feature cut in this file, taken because RAM ran out and none of the levers
# above buy RAM. MEASURED 2026-09-10 at 543b930e, with it on: FLASH overflowed
# by 3,324 B and RAM by 2,496 B, the RAM half being step-up's static buffers
# (s_stepup_sd and s_learn_scratch at 1,536 B each, s_learn_doc at 1,312 B).
# Off, it linked but still missed signing by 34 B (the issuer store Matter
# needs stays), bought back by demoting three matter_ble startup lines that
# report a pass rather than a decision: both SRP sign self-test PASS lines and
# "0xFFF6 transport ready". Their failures still log at ERR.
# A Watch walk-up is diagnosed on the plain image, like the rest of
# ULTRAWIDELOCK_CRED above; a board carrying this image admits only the keys
# the hub sent.
CONFIG_ULTRAWIDELOCK_CRED_STEPUP=n
