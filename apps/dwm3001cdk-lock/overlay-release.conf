# Release profile for the Matter over Thread image.
#
# Build with:
#   make build RELEASE=1
#
# Everything here buys RAM or boot time by giving up ON-BOARD DEBUGGING, so do
# not flash it to a board you are still bringing up. The debug default is what
# every size measurement was taken against, and it stays the default precisely
# because this port is still being debugged.

# The RTT up-buffer is 8,376 B of RAM in a section of its own -- bigger than any
# single thread stack, and on the debug image bigger than the entire free
# margin. 8192 is load-bearing WHILE DEBUGGING: at 4096 the ring filled
# mid-ranging and NO_BLOCK_SKIP silently dropped the grant line, which cost a
# walk-up to diagnose. That is exactly why the ring is given up HERE and nowhere
# else. A release board has no debugger draining it, so the ring only has to
# hold enough to be worth reading if someone attaches after a fault.
#
# Consequence to accept knowingly: with 1 KB the boot log alone truncates, and
# under NO_BLOCK_SKIP it is the NEWEST writes that are discarded. On this image
# a fault therefore looks like a hang. If you are diagnosing anything, drop
# RELEASE=1 rather than raising this number here.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=1024

# Stack painting costs no RAM -- it fills the stacks that already exist -- but it
# costs boot time on every one of the 13 of them, and it exists to be read by a
# debugger that a release board does not have. Kept ON in the debug default,
# where CONFIG_OPENTHREAD_THREAD_STACK_SIZE and CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE
# are still being sized from the 0xAA runs.
CONFIG_INIT_STACKS=n

# Errors only. This is the single largest flash lever on the image and it was
# hiding behind the RAM story: the release profile already gave up the 8 KB RTT
# RING above, but every wrn/inf/dbg FORMAT STRING was still linked into rodata
# for a board with a 1 KB ring that nobody is draining.
#
# MEASURED on this overlay, 2026-08-04, SMP=1 RELEASE=1, app partition only:
#
#   baseline (LOG_DEFAULT_LEVEL=3)   417,308 B   96.23%    16,356 B free
#   LOG_DEFAULT_LEVEL=1              396,740 B   91.49%    36,924 B free
#   CONFIG_LOG=n                     374,796 B   86.43%    58,868 B free
#
# So dropping to errors is worth 20,568 B and dropping logging entirely is
# worth 42,512 B. Level 1 is what is set here, deliberately: the extra 21,944 B
# is real but it buys nothing you can currently spend, and it costs the only
# post-fault evidence this board can produce. RAM moves by 192 B either way --
# this lever is flash, not RAM, which is why it never showed up in the RAM
# inventory.
#
# If a future feature needs that last 21,944 B, CONFIG_LOG=n is measured and
# ready. Do not take it speculatively.
CONFIG_LOG_DEFAULT_LEVEL=1
# prj.conf sets the Bluetooth host to WARNING, which is DOWN from the debug
# images' default and UP from this one's: an explicit module level does not
# follow CONFIG_LOG_DEFAULT_LEVEL. Without this line the host's warning
# strings came back into the shipping image, several kilobytes of them.
CONFIG_BT_LOG_LEVEL_ERR=y
