# The lock half of the two-anchor inside/outside product.
#
# Turns on the WV3 receive path: a sealed, replay-checked distance from the
# satellite (apps/satellite) reaches ultrawidelock_satellite_report()
# and is paired with this node's own measurement of the SAME ranging block. Two
# distances to one phone in one block is what makes a side decision possible.
#
# Needs the latch overlay alongside it, and that is a current limitation rather
# than a design choice: witness_link.c still holds the WV2 consumer inline, so
# the sealed link does not link without it (see ULTRAWIDELOCK_ANCHOR_LINK's help).
#
# Enrolling the key is a two-step dance because the Thread image has no shell:
#   1. flash the READER image, `ultrawidelock anckey <hex32>` over USB CDC
#   2. flash this image WITHOUT --erase, so the settings partition survives
# Give the satellite the same 32 hex characters with `sat key`.
#
# Build:
#   make build LATCH=1 CDK_BUILD=build/cdk-anchorlink \
#     CDK_CONF="overlay-thread.conf;overlay-latch.conf;overlays/bench-2resp.conf;\
#               overlay-anchorlink.conf;overlay-lto.conf"
# or just `make anchorlink`, which spells exactly that.
#
# THIS FILE CARRIES NO BENCH CALIBRATION. The anchor separation, the range
# bias and the frontier offset are properties of where the two boards are
# mounted, so they stay at their shipping Kconfig defaults here and a real
# install sets them. overlays/bench-anchorlink.conf layers this desk's numbers
# on top for bench work; never flash that on a door.
CONFIG_ULTRAWIDELOCK_ANCHOR_LINK=y

# bench-2resp.conf turns the console SAT-HANDOFF line on for `sat join` by
# hand; once the sealed link exists it carries the same handoff itself
# (cherry_ccc_shim.c calls it redundant), so the print only costs flash and
# discloses the URSK.
CONFIG_ULTRAWIDELOCK_SATELLITE_HANDOFF_LOG=n

# The console is RTT and nothing on this image opens a UART, so the serial
# driver stack is dead weight the linker cannot prove dead. Freed the room
# the channel classifier (overlays/mlgate.conf) needs to fit the MCUboot
# slot. If a UART consumer ever joins this stack, drop this line first.
CONFIG_SERIAL=n

# This production-style image keeps credential errors but drops the
# reader/ranging/BLE warnings and INFO trace. The two-anchor bench receipts
# (pair, witness, replay and fail-closed decisions) use their own modules and
# remain. Besides avoiding credential chatter on a console-less image, this
# recovers the MCUboot slot margin that Matter binding consumed; signing, not
# the linker's region percentage, is the final size gate.
#
# It kept credential WARNINGS too until step-up (a Watch learned from its
# Access Document) came in. MEASURED 2026-09-11, with step-up on and the reader
# at WRN, the image overflowed FLASH by 3,692 B. This line with DFU and DW3000
# at WRN bought back 3,636 B; DFU and DW3000 at ERR plus five matter_ble
# bookkeeping lines demoted to DBG (Sigma1 resend, Sigma2 out, DUP replay,
# subscriptions held, reader configuration restored) left the image signing
# with 678 B clear. Signing needs ~210 B the linker does not count. A walk-up
# that fails without saying why is diagnosed on the plain image.
CONFIG_ULTRAWIDELOCK_CRED_LOG_LEVEL_ERR=y
CONFIG_ULTRAWIDELOCK_DFU_LOG_LEVEL_ERR=y
CONFIG_DW3000_LOG_LEVEL_ERR=y

# Sized from measured jitter, which is what the Kconfig help asks for and the
# 90 default never was. Stage C put per-anchor sigma at 61-68 mm, so the
# DIFFERENCE of two anchors carries sigma ~= 92 mm and 250 is a shade under
# 3 sigma. This widens what counts as a possible pair; it does NOT rescue a
# pair that breaks the triangle inequality outright, which is what body
# blocking produces and what the gate must keep refusing.
CONFIG_ULTRAWIDELOCK_ANCHOR_TOL_MM=250
