<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236" role="img" aria-label="Five steps to an unlock. 1 Hello: the phone finds the lock over Bluetooth LE. 2 Prove: the Wallet key is checked on the lock with the Aliro handshake. 3 Measure: UWB radio pulses are timed in flight. 4 Decide: the bolt moves at 1.00 m or less, once three rounds agree. 5 Report: the lock state reaches Apple Home over Matter.">
  <rect x="0.5" y="0.5" width="879" height="235" rx="16" fill="#061012" stroke="#c6e8da" stroke-opacity="0.145"/>

  <!-- the walk-up line: far on the left, the door on the right -->
  <g stroke="#c6e8da" stroke-opacity="0.30" stroke-width="1">
    <path d="M106 60 H774"/>
  </g>
  <path d="M440 60 H607" stroke="#2ee6b8" stroke-width="2"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" text-anchor="middle">
    <g fill="#061012" stroke="#c6e8da" stroke-opacity="0.30" stroke-width="1.5">
      <circle cx="106" cy="60" r="15"/>
      <circle cx="273" cy="60" r="15"/>
      <circle cx="774" cy="60" r="15"/>
    </g>
    <g fill="#061012" stroke="#2ee6b8" stroke-width="1.5">
      <circle cx="440" cy="60" r="15"/>
    </g>
    <circle cx="607" cy="60" r="15" fill="#2ee6b8"/>
    <g fill="#c9d8d2">
      <text x="106" y="64.5">1</text>
      <text x="273" y="64.5">2</text>
      <text x="774" y="64.5">5</text>
    </g>
    <text x="440" y="64.5" fill="#2ee6b8">3</text>
    <text x="607" y="64.5" fill="#04100c">4</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <g font-size="19" font-weight="bold" fill="#f2faf6">
      <text x="106" y="116">Hello</text>
      <text x="273" y="116">Prove</text>
      <text x="440" y="116">Measure</text>
      <text x="607" y="116" fill="#2ee6b8">Decide</text>
      <text x="774" y="116">Report</text>
    </g>

    <g font-size="13" fill="#c9d8d2">
      <text x="106" y="144">The phone finds</text>
      <text x="106" y="162">the lock</text>
      <text x="273" y="144">The lock checks</text>
      <text x="273" y="162">the Wallet key</text>
      <text x="440" y="144">Radio pulses are</text>
      <text x="440" y="162">timed in flight</text>
      <text x="607" y="144">The bolt moves</text>
      <text x="607" y="162">only up close</text>
      <text x="774" y="144">Apple Home</text>
      <text x="774" y="162">shows the state</text>
    </g>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" text-anchor="middle" fill="#8da39b">
    <text x="106" y="198">Bluetooth LE</text>
    <text x="273" y="198">Aliro</text>
    <text x="440" y="198" fill="#5fecc4">UWB · 4.7 mm ticks</text>
    <text x="607" y="198" fill="#5fecc4">≤ 1.00 m · 3 agree</text>
    <text x="774" y="198">Matter</text>
  </g>
</svg>
